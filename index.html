<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path fill=%22%23F0632F%22 d=%22M16 2c1 6-4 8-4 13a4 4 0 0 0 8 0c0-2-1-3-1-5 4 3 6 6 6 10a9 9 0 0 1-18 0C7 12 16 10 16 2z%22/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDEFE9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D110E" media="(prefers-color-scheme: dark)" />
    <title>FIRE Tracker</title>
    <meta
      name="description"
      content="See where you stand on the road to financial independence, and what moves the date."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var raw = localStorage.getItem("fire.ui.v1");
          var mode = raw ? JSON.parse(raw).state.theme : "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
      // Restore deep-link path stashed by 404.html (spa-github-pages trick).
      (function () {
        var l = window.location;
        if (l.search.indexOf("?p=/") === 0 || l.search.indexOf("&p=/") > -1) {
          var q = l.search.slice(1).split("&").reduce(function (acc, kv) {
            var i = kv.indexOf("=");
            acc[kv.slice(0, i)] = kv.slice(i + 1);
            return acc;
          }, {});
          var path = (q.p || "").replace(/~and~/g, "&");
          var search = q.q ? "?" + q.q.replace(/~and~/g, "&") : "";
          history.replaceState(
            null,
            "",
            l.pathname.replace(/\/$/, "") + path + search + l.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
